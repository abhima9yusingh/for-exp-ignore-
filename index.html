<!DOCTYPE html>
<html>
    <head>
        <title>My Quiz</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <section class="scroll-zoom-section">
            <div class="zoom-screen">
                <div class="zoom-content">
                    <span class="eyebrow">Scroll down</span>
                    <h2>Welcome to the Quiz</h2>
                    <p>Get ready to test your knowledge!</p>
                </div>
            </div>
        </section>

        <div class="quiz-container">
            <h1>My Quiz</h1>

            <p id="question-number">Question 1 of 5</p>

            <h2 id="question">Questions goes from here</h2>

            <div id="answers">
                <button>Option 1</button>
                <button>Option 2</button>
                <button>Option 3</button>
                <button>Option 4</button>
            </div>

            <button id="next-btn">Next</button>

            <button id="restart-btn">Restart Quiz</button>

            <p id="score">Score: 0</p>
        </div>

        <script src="script.js"></script>
    </body>
</html>
